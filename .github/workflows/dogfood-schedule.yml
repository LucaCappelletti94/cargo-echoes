name: Dogfood the action on a scheduled pull request

on:
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dogfood-schedule
  cancel-in-progress: true

jobs:
  api-check:
    name: Exercise the pull request review surface
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check branch is pushed with this credential.
          persist-credentials: true

      - name: Mint an app token to open the check pull request
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DOGFOOD_APP_ID }}
          private-key: ${{ secrets.DOGFOOD_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          # The revert commit must come from the app, a push with the workflow token starts no run.
          permission-contents: write

      # A failed run leaves its pull request open; this step keeps the repository free of them.
      - name: Close the previous check pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,title \
            | jq -r '.[] | select(.title | startswith("echoes API check")) | .number' \
            | while read -r n; do
                gh pr close "$n"
              done

      - name: Open the check pull request
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="dogfood-api-check-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Two copies the base does not have, so only-new mode posts on them. The first
          # rewrites pack_argb with other names, temporaries, decimal and folded literals,
          # reordered operands, an inverted branch, a dead binding and an explicit return.
          # The second is an indented doctest copy. The apicheck fixture is not pinned by
          # the integration tests, dupws is.
          printf '%s\n' '' \
            '/// The same packing, written again.' \
            'fn colour(x: u32, y: u32, z: u32, w: u32, solid: bool) -> u32 {' \
            '    // Blue first, then green and red, alpha on top.' \
            '    let unused = 17u32;' \
            '    let lo = 255u32 & z;' \
            '    let mid = (y & 255u32) << (2u32 * 4u32);' \
            '    let packed = lo | mid | (x & 0xffu32) << 16u32;' \
            '    let top = if !solid { w & 255u32 } else { 255u32 };' \
            '    let shown = if top == 0u32 { 0u32 } else { packed };' \
            '    return top << 24u32 | shown;' \
            '}' \
            '' \
            '/// An indented copy added by the API check.' \
            '///' \
            '///     @ nope nope' \
            'pub fn unparsed_indented() {}' \
            >> tests/fixtures/apicheck/src/lib.rs
          git add tests/fixtures/apicheck/src/lib.rs
          git commit -m "Add a function copy and a doctest copy for the API check"
          git push origin "$branch"
          url="$(gh pr create --head "$branch" --title "echoes API check, $(date -u +%F)" --body 'Opened by the scheduled dogfood to exercise the pull request review surface against the GitHub API. It closes itself when the check passes.')"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      # The pull request runs of the dogfood workflow post the review, then clean it up after the
      # copies are reverted, and assert both. Each wait correlates on the head sha and workflow path.
      - name: Wait for the dogfood runs
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          wait_run() {
            local sha="$1" what="$2" i run_json status conclusion
            for i in $(seq 1 20); do
              run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=50" --jq '[.workflow_runs[] | select(.path == ".github/workflows/dogfood.yml")] | first // empty' 2>/dev/null)"
              if [ -n "$run_json" ]; then
                status="$(printf '%s' "$run_json" | jq -r '.status')"
                conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" = "success" ]; then
                    echo "the dogfood run $what succeeded"
                    return 0
                  fi
                  echo "the dogfood run $what finished with $conclusion, the check pull request stays open for inspection"
                  return 1
                fi
              fi
              [ "$i" -lt 20 ] && sleep 90
            done
            echo "the dogfood run $what did not finish within the 30 minute window, the check pull request stays open for inspection"
            return 1
          }
          wait_run "$(git rev-parse HEAD)" "on the copies" || exit 1
          git revert --no-edit HEAD
          # The checkout persisted the workflow token as a header, which would override the app token.
          git -c 'http.https://github.com/.extraheader=' push \
            "https://x-access-token:$APP_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:dogfood-api-check-$GITHUB_RUN_ID"
          wait_run "$(git rev-parse HEAD)" "on the revert" || exit 1

      - name: Close the check pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.open.outputs.number }}
        run: gh pr close "$PR_NUMBER"
