name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: shellcheck -x -S warning scripts/*.sh tests/action/fake/bin/gh tests/action/fake/bin/cargo .clusterfuzzlite/build.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p echoes --all-targets --no-default-features --features std --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            run: cargo nextest run --workspace
          - name: std
            run: cargo nextest run -p echoes --no-default-features --features std
          - name: no-std
            run: cargo nextest run --workspace --lib --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ${{ matrix.run }} --locked --cargo-profile fast-test --profile ci
      - if: matrix.name == 'default'
        run: cargo test --workspace --doc --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  witnesses:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: python3 -B -m unittest discover -s tests -p dependency_witnesses_test.py -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Verify dependency witnesses
        id: dependency_witnesses
        run: >-
          python3 -B tests/dependency_witnesses.py
          --request-id "DG-CI-M0-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/dependency-witnesses.json"
          --timeout 180
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.dependency_witnesses.outcome != 'skipped'
        with:
          name: dependency-witnesses
          path: ${{ runner.temp }}/dependency-witnesses.json
      - name: Verify macro punctuation witnesses
        id: dependency_macro_witnesses
        run: >-
          python3 -B tests/dependency_witnesses.py
          --cases tests/fixtures/dependency/macro_cases.json
          --request-id "DG-CI-MACRO-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/macro-witnesses.json"
          --timeout 180
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.dependency_macro_witnesses.outcome != 'skipped'
        with:
          name: macro-witnesses
          path: ${{ runner.temp }}/macro-witnesses.json
      - name: Verify tail scope witnesses
        id: dependency_tail_witnesses
        run: >-
          python3 -B tests/dependency_witnesses.py
          --cases tests/fixtures/dependency/tail_cases.json
          --request-id "DG-CI-TAIL-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/tail-witnesses.json"
          --timeout 180
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.dependency_tail_witnesses.outcome != 'skipped'
        with:
          name: tail-witnesses
          path: ${{ runner.temp }}/tail-witnesses.json
      - name: Verify checked constant witnesses
        id: dependency_constants_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --request-id "DG-CI-M2-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/dependency-constants-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.dependency_constants_witnesses.outcome != 'skipped'
        with:
          name: dependency-constants-witnesses
          path: ${{ runner.temp }}/dependency-constants-witnesses.json
      - name: Verify primitive algebra witnesses
        id: dependency_algebra_witnesses
        run: |
          python3 -B tests/dependency_constants_witnesses.py --cases tests/fixtures/dependency/algebra_cases.json --request-id "DG-CI-M3-${{ github.run_id }}-${{ github.run_attempt }}" --output "${{ runner.temp }}/dependency-algebra-witnesses.json" --timeout 600
          python3 -B tests/dependency_constants_witnesses.py --cases tests/fixtures/dependency/algebra_signed_cases.json --request-id "DG-CI-M3-SIGNED-${{ github.run_id }}-${{ github.run_attempt }}" --output "${{ runner.temp }}/dependency-algebra-signed-witnesses.json" --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.dependency_algebra_witnesses.outcome != 'skipped'
        with:
          name: dependency-algebra-witnesses
          path: |
            ${{ runner.temp }}/dependency-algebra-witnesses.json
            ${{ runner.temp }}/dependency-algebra-signed-witnesses.json
      - name: Verify primitive reflexive equality witnesses
        id: reflexive_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/reflexive_cases.json
          --request-id "DG-CI-REFLEXIVE-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/reflexive-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.reflexive_witnesses.outcome != 'skipped'
        with:
          name: reflexive-witnesses
          path: ${{ runner.temp }}/reflexive-witnesses.json
      - name: Verify primitive XOR witnesses
        id: xor_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/xor_cases.json
          --request-id "DG-CI-XOR-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/xor-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.xor_witnesses.outcome != 'skipped'
        with:
          name: xor-witnesses
          path: ${{ runner.temp }}/xor-witnesses.json
      - name: Verify native wrapping_add witnesses
        id: wrapping_add_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/wrapping_add_cases.json
          --request-id "DG-CI-WRAPPING-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/wrapping-add-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.wrapping_add_witnesses.outcome != 'skipped'
        with:
          name: wrapping-add-witnesses
          path: ${{ runner.temp }}/wrapping-add-witnesses.json
      - name: Verify boolean match witnesses
        id: boolean_match_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/boolean_match_cases.json
          --request-id "DG-CI-BOOLMATCH-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/boolean-match-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.boolean_match_witnesses.outcome != 'skipped'
        with:
          name: boolean-match-witnesses
          path: ${{ runner.temp }}/boolean-match-witnesses.json
      - name: Verify string-literal concat witnesses
        id: concat_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/concat_cases.json
          --request-id "DG-CI-CONCAT-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/concat-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.concat_witnesses.outcome != 'skipped'
        with:
          name: concat-witnesses
          path: ${{ runner.temp }}/concat-witnesses.json
      - name: Verify boolean literal comparison witnesses
        id: boolean_literal_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/boolean_literal_cases.json
          --request-id "DG-CI-BOOLLIT-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/boolean-literal-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.boolean_literal_witnesses.outcome != 'skipped'
        with:
          name: boolean-literal-witnesses
          path: ${{ runner.temp }}/boolean-literal-witnesses.json
      - name: Verify boolean logic witnesses
        id: boolean_logic_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/boolean_logic_cases.json
          --request-id "DG-CI-BOOLLOGIC-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/boolean-logic-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.boolean_logic_witnesses.outcome != 'skipped'
        with:
          name: boolean-logic-witnesses
          path: ${{ runner.temp }}/boolean-logic-witnesses.json
      - name: Verify compound assignment witnesses
        id: compound_assignment_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/compound_assignment_cases.json
          --request-id "DG-CI-COMPOUND-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/compound-assignment-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.compound_assignment_witnesses.outcome != 'skipped'
        with:
          name: compound-assignment-witnesses
          path: ${{ runner.temp }}/compound-assignment-witnesses.json
      - name: Verify let literal annotation witnesses
        id: let_literal_witnesses
        run: >-
          python3 -B tests/dependency_constants_witnesses.py
          --cases tests/fixtures/dependency/let_literal_cases.json
          --request-id "DG-CI-LETLIT-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "${{ runner.temp }}/let-literal-witnesses.json"
          --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.let_literal_witnesses.outcome != 'skipped'
        with:
          name: let-literal-witnesses
          path: ${{ runner.temp }}/let-literal-witnesses.json
