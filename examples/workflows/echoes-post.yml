name: echoes-post
on:
  workflow_run:
    workflows: [echoes]
    types: [completed]
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      # Resolving the review threads of copies that are gone needs contents: write.
      contents: write
      pull-requests: write
    # This job holds a write token, so it must never check out or run pull-request code.
    # The action reviews only the open pull request whose head the triggering run built.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: echoes-payload
          path: echoes-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: LucaCappelletti94/cargo-echoes@v1
        with:
          mode: post
          payload: echoes-payload
